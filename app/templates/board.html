<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobTrack</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; }
    header { padding: 16px 24px; background: #1f2937; color: #fff; }
    header a { color: #93c5fd; margin-left: 16px; }
    .board { display: flex; gap: 12px; padding: 16px; overflow-x: auto; }
    .col { flex: 1; min-width: 200px; background: #e5e7eb; border-radius: 8px; padding: 10px; }
    .col h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; color: #374151; }
    .card { background: #fff; border-radius: 6px; padding: 10px; margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,.1); cursor: grab; }
    .card small { color: #6b7280; }
    .empty { color: #9ca3af; font-size: 13px; }
    .list { min-height: 60px; }
  </style>
</head>
<body>
  <header>
    <strong>JobTrack</strong> &middot; {{ total }} applications
    <a href="/add">+ Add email</a>
    <a href="/review">Review</a>
  </header>

  <div class="board">
    {% for key, label in columns %}
    <div class="col">
      <h2>{{ label }} (<span class="count">{{ grouped[key]|length }}</span>)</h2>
      <div class="list" data-status="{{ key }}">
        {% for a in grouped[key] %}
        <div class="card" data-id="{{ a.id }}">
          <strong>{{ a.company }}</strong><br>
          <small>{{ a.role }}{% if a.last_event_at %} &middot; {{ a.last_event_at.strftime("%d %b") }}{% endif %}</small>
        </div>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script>
    document.querySelectorAll(".list").forEach(list => {
      new Sortable(list, {
        group: "cards",
        animation: 150,
        onEnd: async (evt) => {
          const id = evt.item.dataset.id;
          const status = evt.to.dataset.status;
          const res = await fetch(`/applications/${id}/status`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status }),
          });
          if (!res.ok) { alert("Could not save, reloading."); location.reload(); }
          document.querySelectorAll(".col").forEach(col => {
            col.querySelector(".count").textContent =
              col.querySelectorAll(".card").length;
          });
        },
      });
    });
  </script>
</body>
</html>
