<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review - JobTrack</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; }
    header { padding: 16px 24px; background: #1f2937; color: #fff; }
    header a { color: #93c5fd; margin-left: 16px; }
    .item { max-width: 640px; margin: 16px auto; background: #fff; padding: 16px;
            border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .item small { color: #6b7280; }
    input { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: 8px 14px; background: #2563eb; color: #fff; border: 0;
             border-radius: 6px; cursor: pointer; }
    .empty { text-align: center; color: #6b7280; margin-top: 40px; }
  </style>
</head>
<body>
  <header><strong>JobTrack</strong> <a href="/">Board</a> <a href="/add">+ Add email</a></header>
  {% for e in pending %}
  <div class="item">
    <strong>{{ e.subject }}</strong><br>
    <small>{{ e.sender }}</small>
    <p>{{ e.snippet }}</p>
    <form method="post" action="/review/{{ e.id }}">
      <input name="company" placeholder="Which company?" required>
      <button type="submit">Save</button>
    </form>
  </div>
  {% else %}
  <p class="empty">Nothing to review.</p>
  {% endfor %}
</body>
</html>
