<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add email - JobTrack</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; }
    header { padding: 16px 24px; background: #1f2937; color: #fff; }
    header a { color: #93c5fd; margin-left: 16px; }
    form { max-width: 640px; margin: 24px auto; background: #fff; padding: 20px;
           border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit;
                      border: 1px solid #d1d5db; border-radius: 6px; }
    button { margin-top: 16px; padding: 10px 18px; background: #2563eb; color: #fff;
             border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    .msg { max-width: 640px; margin: 16px auto 0; padding: 10px 14px; background: #dbeafe;
           border-radius: 6px; }
  </style>
</head>
<body>
  <header><strong>JobTrack</strong> <a href="/">Board</a></header>
  {% if message %}<div class="msg">{{ message }}</div>{% endif %}
  <form method="post" action="/add">
    <label for="sender">Sender</label>
    <input id="sender" name="sender" placeholder="Acme Careers &lt;no-reply@greenhouse.io&gt;">
    <label for="subject">Subject</label>
    <input id="subject" name="subject" required>
    <label for="body">Email body</label>
    <textarea id="body" name="body" rows="8"></textarea>
    <button type="submit">Add email</button>
  </form>
</body>
</html>
